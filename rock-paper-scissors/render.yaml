services:
  # Backend Server
  - type: web
    name: rps-server
    env: node
    region: oregon
    plan: free
    rootDir: rock-paper-scissors
    buildCommand: npm install && npm run build:server
    startCommand: node server/dist/server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /health

  # Frontend Client
  - type: web
    name: rps-client
    env: static
    region: oregon
    plan: free
    rootDir: rock-paper-scissors
    buildCommand: npm install && npm run build:client
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
